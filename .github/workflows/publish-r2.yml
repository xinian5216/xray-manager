name: Publish offline bundles to R2

on:
  schedule:
    # Xray 官方 GeoData 每日更新后再刷新 R2（北京时间 08:30）。
    - cron: "30 0 * * *"

  push:
    branches:
      - main
    paths:
      - "xray-manager.sh"
      - "install.sh"
      - "offline-install.sh"
      - "cloudflare-install.sh"
      - "VERSION"
      - "XRAY_VERSION"
      - "SHA256SUMS"
      - "lib/**"
      - "scripts/select-xray-release.sh"
      - "tests/smoke-configs.sh"
      - ".github/workflows/publish-r2.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-xray-manager-r2
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      R2_BUCKET: xray-manager-private
      XRAY_RELEASE_DELAY_DAYS: "14"
      GEODATA_RELEASE_DELAY_DAYS: "7"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v6

      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub secret or variable: $name"
              exit 1
            fi
          done

          test -s cloudflare-install.sh

      - name: Validate repository files
        shell: bash
        run: |
          set -Eeuo pipefail

          bash -n xray-manager.sh
          bash -n install.sh
          bash -n offline-install.sh
          bash -n cloudflare-install.sh
          bash -n lib/xray-manager-core.sh

          sha256sum -c SHA256SUMS

      - name: Resolve mature stable Xray and download packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          mkdir -p downloads
          PINNED_XRAY_VERSION="$(tr -d '[:space:]' < XRAY_VERSION)"
          if ! curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=100" \
            -o downloads/xray-releases.json
          then
            printf '[]\n' > downloads/xray-releases.json
          fi
          XRAY_VERSION="$(bash scripts/select-xray-release.sh \
            downloads/xray-releases.json \
            "$PINNED_XRAY_VERSION" \
            "$XRAY_RELEASE_DELAY_DAYS")"
          [[ "$XRAY_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' "$XRAY_VERSION" > XRAY_VERSION
          echo "R2_XRAY_VERSION=$XRAY_VERSION" >> "$GITHUB_ENV"
          echo "R2 将打包发布已满 ${XRAY_RELEASE_DELAY_DAYS} 天的稳定版：$XRAY_VERSION"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o downloads/Xray-linux-64.zip

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-arm64-v8a.zip" \
            -o downloads/Xray-linux-arm64-v8a.zip

          unzip -t downloads/Xray-linux-64.zip
          unzip -t downloads/Xray-linux-arm64-v8a.zip

      - name: Download and verify mature GeoData snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          download_geodata() {
            local name="$1" expected actual attempt commit_sha cutoff
            cutoff="$(date -u -d "$GEODATA_RELEASE_DELAY_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
            commit_sha="$(
              curl -fsSL \
                --retry 5 \
                --retry-all-errors \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/commits?sha=release&path=${name}.dat&until=${cutoff}&per_page=1" |
                jq -r '.[0].sha // empty'
            )"
            [[ "$commit_sha" =~ ^[[:xdigit:]]{40}$ ]] || {
              echo "::error::Cannot resolve a mature ${name}.dat commit" >&2
              return 1
            }

            for attempt in 1 2 3; do
              curl -fsSL \
                --retry 5 \
                --retry-all-errors \
                "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/${commit_sha}/${name}.dat.sha256sum" \
                -o "downloads/${name}.dat.sha256sum"
              curl -fsSL \
                --retry 5 \
                --retry-all-errors \
                "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/${commit_sha}/${name}.dat" \
                -o "downloads/${name}.dat"

              expected="$(awk '{print $1; exit}' "downloads/${name}.dat.sha256sum")"
              actual="$(sha256sum "downloads/${name}.dat" | awk '{print $1}')"
              if [[ "$expected" =~ ^[[:xdigit:]]{64}$ && "$expected" == "$actual" ]]; then
                echo "Verified ${name}.dat from mature commit ${commit_sha}: $actual"
                return 0
              fi
              echo "GeoData changed during download; retry $attempt/3" >&2
              sleep 5
            done
            echo "::error::Unable to obtain a matching ${name}.dat checksum" >&2
            return 1
          }

          download_geodata geoip
          download_geodata geosite

      - name: Test packaged Xray version
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/xray-r2-test
          unzip -q downloads/Xray-linux-64.zip xray -d /tmp/xray-r2-test
          chmod +x /tmp/xray-r2-test/xray
          install -m 644 downloads/geoip.dat downloads/geosite.dat /tmp/xray-r2-test/
          XRAY_LOCATION_ASSET=/tmp/xray-r2-test \
            XRAY_TEST_BIN=/tmp/xray-r2-test/xray \
            bash tests/smoke-configs.sh

          cat >/tmp/xray-r2-test/geodata-test.json <<'JSON'
          {
            "routing": {
              "rules": [
                {"type":"field","domain":["geosite:google"],"outboundTag":"direct"},
                {"type":"field","ip":["geoip:private"],"outboundTag":"direct"}
              ]
            },
            "outbounds": [{"tag":"direct","protocol":"freedom"}]
          }
          JSON
          XRAY_LOCATION_ASSET=/tmp/xray-r2-test \
            /tmp/xray-r2-test/xray run \
              -config /tmp/xray-r2-test/geodata-test.json -test

      - name: Build offline bundles
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p output

          build_bundle() {
            local arch="$1"
            local xray_zip="$2"
            local root="build/$arch"
            local manager="$root/xray-manager"
            local payload="$root/payload"

            mkdir -p "$manager/lib" "$payload"

            install -m 755 xray-manager.sh \
              "$manager/xray-manager.sh"

            install -m 755 install.sh \
              "$manager/install.sh"

            install -m 755 offline-install.sh \
              "$manager/offline-install.sh"

            install -m 755 lib/xray-manager-core.sh \
              "$manager/lib/xray-manager-core.sh"

            install -m 644 VERSION \
              "$manager/VERSION"

            install -m 644 XRAY_VERSION \
              "$manager/XRAY_VERSION"

            install -m 644 SHA256SUMS \
              "$manager/SHA256SUMS"

            install -m 644 "$xray_zip" \
              "$payload/$(basename "$xray_zip")"

            install -m 644 downloads/geoip.dat \
              "$payload/geoip.dat"

            install -m 644 downloads/geosite.dat \
              "$payload/geosite.dat"

            test -s "$payload/geoip.dat"
            test -s "$payload/geosite.dat"

            tar -C "$root" \
              -czf "output/latest-${arch}.tar.gz" \
              xray-manager payload

            sha256sum "output/latest-${arch}.tar.gz" |
              awk '{print $1}' \
              > "output/latest-${arch}.sha256"
          }

          build_bundle \
            amd64 \
            downloads/Xray-linux-64.zip

          build_bundle \
            arm64 \
            downloads/Xray-linux-arm64-v8a.zip

          install -m 755 \
            cloudflare-install.sh \
            output/install.sh

          ls -lh output

      - name: Upload packages to private R2
        shell: bash
        run: |
          set -Eeuo pipefail

          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          upload() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            local cache_control="$4"

            aws s3 cp \
              "$source" \
              "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --cache-control "$cache_control" \
              --only-show-errors
          }

          # 先上传较大的包，再上传校验文件
          upload \
            output/latest-amd64.tar.gz \
            releases/latest-amd64.tar.gz \
            application/gzip \
            no-store

          upload \
            output/latest-arm64.tar.gz \
            releases/latest-arm64.tar.gz \
            application/gzip \
            no-store

          upload \
            output/latest-amd64.sha256 \
            releases/latest-amd64.sha256 \
            "text/plain; charset=utf-8" \
            no-store

          upload \
            output/latest-arm64.sha256 \
            releases/latest-arm64.sha256 \
            "text/plain; charset=utf-8" \
            no-store

          # 最后更新一键入口
          upload \
            output/install.sh \
            public/install.sh \
            "text/x-shellscript; charset=utf-8" \
            "public, max-age=300"

      - name: Verify R2 objects
        shell: bash
        run: |
          set -Eeuo pipefail

          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          for key in \
            public/install.sh \
            releases/latest-amd64.tar.gz \
            releases/latest-amd64.sha256 \
            releases/latest-arm64.tar.gz \
            releases/latest-arm64.sha256
          do
            aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$endpoint" \
              >/dev/null

            echo "Verified: $key"
          done
