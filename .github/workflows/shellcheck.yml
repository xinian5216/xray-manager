name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n xray-manager.sh
          bash -n install.sh
          bash -n scripts/refresh-checksums.sh

      - name: Verify project version
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = \
            "$(sed -n 's/^SCRIPT_VERSION="\(.*\)"/\1/p' xray-manager.sh | head -n1)"

      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck -S warning xray-manager.sh
          shellcheck -S warning install.sh
          shellcheck -S warning scripts/refresh-checksums.sh
