name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tests/legacy-manager-upgrade.sh extracts real historical fixtures from
          # pinned ancestor commits; the repository pack is under 0.5 MB.
          fetch-depth: 0
      - name: Bash syntax
        run: |
          bash -n xray-manager.sh
          bash -n lib/xray-manager-core.sh
          bash -n install.sh
          bash -n offline-install.sh
          bash -n scripts/refresh-checksums.sh
          bash -n scripts/verify-xray-asset.sh
          bash -n scripts/maintainer-map.sh
          bash -n tests/maintainer-map.sh
          bash -n tests/bootstrap-install.sh
          bash -n tests/inbound-management.sh
          bash -n tests/wireguard-management.sh
          bash -n tests/smoke-configs.sh
          bash -n tests/offline-install.sh
          bash -n tests/config-migration.sh
          bash -n tests/backup-restore.sh
          bash -n tests/version-lock.sh
          bash -n tests/manager-menu-update.sh
          bash -n tests/atomic-release.sh
          bash -n tests/xray-version-select.sh
          bash -n tests/xray-asset-integrity.sh
          bash -n tests/legacy-manager-upgrade.sh
          bash -n tests/anonymous-public-verify.sh
      - name: Verify project version
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "$(sed -n 's/^PROJECT_VERSION="\(.*\)"/\1/p' xray-manager.sh | head -n1)"
          test "$(tr -d '[:space:]' < VERSION)" = "$(sed -n 's/^CORE_VERSION="\(.*\)"/\1/p' xray-manager.sh | head -n1)"
          test "$(tr -d '[:space:]' < VERSION)" = "$(sed -n 's/^SCRIPT_VERSION="\(.*\)"/\1/p' lib/xray-manager-core.sh | head -n1)"
          grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' XRAY_VERSION
      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Verify maintainer navigation
        run: bash tests/maintainer-map.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck launchers
        run: shellcheck -S warning xray-manager.sh install.sh offline-install.sh scripts/refresh-checksums.sh scripts/verify-xray-asset.sh
      - name: ShellCheck core
        run: |
          shellcheck -S warning scripts/maintainer-map.sh tests/maintainer-map.sh
          shellcheck -S warning tests/bootstrap-install.sh
          shellcheck -S warning lib/xray-manager-core.sh
          shellcheck -e SC2034 -S warning tests/inbound-management.sh
          shellcheck -e SC2034 -S warning tests/wireguard-management.sh
          # The smoke test intentionally rebinds globals consumed by sourced Core functions.
          shellcheck -e SC2034 -S warning tests/smoke-configs.sh
          shellcheck -e SC2034 -S warning tests/offline-install.sh
          shellcheck -e SC2034 -S warning tests/config-migration.sh
          shellcheck -e SC2034 -S warning tests/backup-restore.sh
          shellcheck -e SC2034 -S warning tests/version-lock.sh
          shellcheck -e SC2034 -S warning tests/manager-menu-update.sh
          shellcheck -e SC2034 -S warning tests/atomic-release.sh
          shellcheck -S warning tests/xray-version-select.sh
          shellcheck -S warning tests/xray-asset-integrity.sh
          shellcheck -S warning tests/legacy-manager-upgrade.sh
          shellcheck -S warning tests/anonymous-public-verify.sh
      - name: Offline import test
        run: bash tests/offline-install.sh
      - name: Bootstrap dependency test
        run: sudo bash tests/bootstrap-install.sh
      - name: Existing configuration migration test
        run: bash tests/config-migration.sh
      - name: Backup restore transaction test
        run: bash tests/backup-restore.sh
      - name: Version policy and operation lock test
        run: bash tests/version-lock.sh
      - name: Atomic Manager release test
        run: bash tests/atomic-release.sh
      - name: Manager menu update test
        run: bash tests/manager-menu-update.sh
      - name: Xray version selection test
        run: bash tests/xray-version-select.sh
      - name: Xray asset integrity test
        run: bash tests/xray-asset-integrity.sh
      - name: Legacy manager upgrade test
        run: sudo bash tests/legacy-manager-upgrade.sh
      - name: Inbound management regression test
        run: bash tests/inbound-management.sh
      - name: WireGuard management regression test
        run: bash tests/wireguard-management.sh
      - name: Xray configuration smoke tests
        run: |
          XRAY_VERSION="$(tr -d '[:space:]' < XRAY_VERSION)"
          curl -fL --retry 3 \
            -o /tmp/Xray-linux-64.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q /tmp/Xray-linux-64.zip xray geoip.dat geosite.dat -d /tmp/xray-test
          chmod +x /tmp/xray-test/xray
          XRAY_TEST_BIN=/tmp/xray-test/xray \
            XRAY_TEST_ASSET_DIR=/tmp/xray-test \
            bash tests/smoke-configs.sh
